<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chronos</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='none' stroke='%23c8962a' stroke-width='6'/%3E%3Cpath d='M50 26v26l18 10' fill='none' stroke='%23c8962a' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1>Chronos</h1>
        <p class="tagline">Time &amp; client work</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="today" class="active">Today</button>
      <button data-view="todos">To-do</button>
      <button data-view="clients">Clients</button>
      <button data-view="reports">Reports</button>
    </nav>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙</button>
  </header>

  <main id="app">
    <!-- ===== TODAY ===== -->
    <section id="view-today" class="view">
      <div class="day-nav">
        <button id="day-prev" class="icon-btn" title="Previous day" aria-label="Previous day">‹</button>
        <div class="day-label" id="day-label">Today</div>
        <input type="date" id="day-pick" aria-label="Jump to date" />
        <button id="day-next" class="icon-btn" title="Next day" aria-label="Next day">›</button>
        <button id="day-today" class="ghost-btn" hidden>Back to today</button>
      </div>

      <div class="daybar" id="daybar"></div>

      <div id="attention" class="attention" hidden></div>

      <div class="timer-card" id="timer-card"></div>

      <details class="manual" id="manual">
        <summary>Add an entry</summary>
        <form id="manual-form" class="manual-form"></form>
      </details>

      <h2 class="section-title" id="entries-title">Today's entries</h2>
      <div id="entries" class="entries"></div>
    </section>

    <!-- ===== TO-DO ===== -->
    <section id="view-todos" class="view" hidden>
      <h2 class="section-title">To-do</h2>
      <form id="todo-form" class="todo-form">
        <input name="title" placeholder="What needs doing?" required class="grow" />
        <select name="client" id="todo-client"></select>
        <input type="date" name="due" title="Due date" />
        <label class="chk"><input type="checkbox" name="priority" /> High</label>
        <button type="submit">Add</button>
      </form>
      <div id="todo-list" class="todo-list"></div>
      <details id="todo-done-wrap" class="todo-done-wrap" hidden>
        <summary>Completed</summary>
        <div id="todo-done" class="todo-list done"></div>
      </details>
    </section>

    <!-- ===== CLIENTS ===== -->
    <section id="view-clients" class="view" hidden>
      <div class="split">
        <div class="col">
          <h2 class="section-title">Clients</h2>
          <form id="client-form" class="inline-form">
            <input name="name" placeholder="Client name" required />
            <input name="code" placeholder="Code" class="short" />
            <button type="submit">Add</button>
          </form>
          <div id="client-list" class="client-list"></div>
        </div>
        <div class="col">
          <h2 class="section-title" id="client-detail-title">Select a client</h2>
          <div id="client-detail" class="client-detail"></div>
        </div>
      </div>
    </section>

    <!-- ===== REPORTS ===== -->
    <section id="view-reports" class="view" hidden>
      <h2 class="section-title">Reports</h2>
      <form id="report-form" class="report-form">
        <label>From <input type="date" name="from" /></label>
        <label>To <input type="date" name="to" /></label>
        <label>Group by
          <select name="group_by">
            <option value="client">Client</option>
            <option value="work_type">Work type</option>
            <option value="day">Day</option>
          </select>
        </label>
        <button type="submit">Run</button>
        <a id="export-link" class="ghost-btn" href="#">Export CSV</a>
      </form>
      <div id="report-out" class="report-out"></div>
    </section>
  </main>

  <!-- settings dialog -->
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <h2>Settings</h2>
      <p class="dialog-note">Your daily standard is the hours you need to code; anything past it counts as overtime.</p>
      <label>Busy season — Jan–Apr (hours/day)<input name="busy" type="number" step="0.1" min="0" /></label>
      <label>Off season — May–Dec (hours/day)<input name="off" type="number" step="0.1" min="0" /></label>
      <label>Billing increment (minutes)<input name="rounding" type="number" step="1" min="0" /></label>
      <label>Timezone (IANA, blank = server local)<input name="timezone" placeholder="America/Toronto" /></label>
      <div class="dialog-actions">
        <button value="cancel" class="ghost-btn">Cancel</button>
        <button value="save" id="settings-save">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
